; AeroCool V1 - Cura Print Profile
; Material: PETG
; Printer: Generic FDM (220x220x250mm)

[settings]
layer_height = 0.2
wall_thickness = 1.2
top_bottom_thickness = 0.8
infill_sparse_density = 15
infill_pattern = grid
material_print_temperature = 240
material_bed_temperature = 75
speed_print = 50
speed_travel = 120
retraction_enable = True
retraction_amount = 1.5
retraction_speed = 25
cooling_enabled = True
fan_speed = 50
adhesion_type = brim
brim_width = 8
support_enable = False

; AeroCool-specific notes:
; - Funnel arrays: print vertically (standing on inlet) for best surface finish
; - Base frame: print flat, 20% infill for structural strength
; - Water system: 100% infill for leak-proof channels
; - Side panels: 15% infill, grid pattern for airflow
