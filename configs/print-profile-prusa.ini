; AeroCool V1 - PrusaSlicer Print Profile
; Material: PETG
; Printer: Generic FDM (220x220x250mm)

[settings]
layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 3
fill_density = 15%
fill_pattern = grid
temperature = 240
bed_temperature = 75
perimeter_speed = 45
infill_speed = 55
travel_speed = 120
retract_length = 1.5
retract_speed = 25
fan_always_on = True
fan_speed = 50
brim_width = 8
support_material = 0

; AeroCool-specific notes:
; - Funnel arrays: print vertically (standing on inlet) for best surface finish
; - Base frame: print flat, 20% infill for structural strength
; - Water system: 100% infill for leak-proof channels
; - Side panels: 15% infill, grid pattern for airflow
